services:
  subledger:
    image: blue060/subledger:latest
    build: .
    container_name: subledger
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - subledger_data:/data
    environment:
      # 首次部署前直接在这里设置管理员账号和密码。
      # 已创建管理员的旧数据库不会因修改这里而覆盖现有账号。
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=
      # 填写至少 32 个字符的随机字符串，可用 openssl rand -hex 32 生成。
      - SECRET_KEY=
      # 使用 HTTPS 域名访问时改为 true；直接使用 HTTP 时保持 false。
      - COOKIE_SECURE=false
      - ENV=production
      # Optional: SMTP
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TLS=${SMTP_TLS:-true}
      # Optional: Push
      - BARK_URL=${BARK_URL:-}
      - SERVERCHAN_KEY=${SERVERCHAN_KEY:-}

volumes:
  subledger_data:
